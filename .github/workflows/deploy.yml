name: CI

on:
  pull_request:
  push:
    branches: [development, main]
  workflow_dispatch:

concurrency:
  group: media-service-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-west-1
  SLS_DISABLE_AUTO_UPDATE: '1'
  SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
  SERVERLESS_LICENSE_KEY: ${{ secrets.SERVERLESS_LICENSE_KEY }}

jobs:
  test:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn
        run: corepack enable
      - name: Install
        run: yarn install --immutable
      - name: Lint
        run: yarn lint
      - name: Typecheck
        run: yarn typecheck
      - name: Test
        run: yarn test:coverage

  deploy-dev:
    name: deploy (dev)
    needs: test
    if: |
      github.ref == 'refs/heads/development' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: dev
    env:
      ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn
        run: corepack enable
      - name: Install
        run: yarn install --immutable
      - name: Skip deploy (no AWS_DEPLOY_ROLE_ARN)
        if: env.ROLE_ARN == ''
        run: |
          echo "Set GitHub Environment variable AWS_DEPLOY_ROLE_ARN to the bootstrap output deploy_role_arn (or SSM /dev/ci/deploy-role-arn)." >> "$GITHUB_STEP_SUMMARY"
      - name: Configure AWS (OIDC)
        if: env.ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy
        if: env.ROLE_ARN != ''
        run: yarn sls deploy --stage dev --verbose

  deploy-prod:
    name: deploy (prod)
    needs: test
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: prod
    env:
      ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn
        run: corepack enable
      - name: Install
        run: yarn install --immutable
      - name: Skip deploy (no AWS_DEPLOY_ROLE_ARN)
        if: env.ROLE_ARN == ''
        run: |
          echo "Set GitHub Environment variable AWS_DEPLOY_ROLE_ARN to the prod bootstrap output deploy_role_arn." >> "$GITHUB_STEP_SUMMARY"
      - name: Configure AWS (OIDC)
        if: env.ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy
        if: env.ROLE_ARN != ''
        run: yarn sls deploy --stage prod --verbose
